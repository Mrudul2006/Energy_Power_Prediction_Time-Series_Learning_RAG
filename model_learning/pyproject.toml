[project]
name = "ps1-ragbait"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "torch",
    "statsmodels",
    "prophet",
    "tbats",
    "xgboost",
    "lightgbm",
    "openpyxl",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["requirements.txt"]
